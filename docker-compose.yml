services:
  tarea2:
    build:
      context: .
      dockerfile: Dockerfile

    image: tarea2-compras:latest

    ports:
      - "${APP_PORT:-3001}:${APP_PORT:-3001}"

    environment:
      APP_PORT: ${APP_PORT:-3001}
      APP_ENV: production
      CSV_PATH: /app/data/compras.csv

    volumes:
      - ./compras.csv:/app/data/compras.csv:ro